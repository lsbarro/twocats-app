<text x="20" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">Envelopes travel in both directions. A friend's phone, once shared ledgers open, pulls the envelopes addressed to it and replays them locally.</text>
