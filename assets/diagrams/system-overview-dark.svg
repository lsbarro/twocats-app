<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t">
<title id="t">two cats system overview: the iPhone's SQLite ledger is the source of truth; a Go server on Render stores sync envelopes in PlanetScale Postgres, proxies receipts to Azure Document Intelligence, keeps photos in Cloudflare R2 and backs up nightly to Backblaze B2.</title>

<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7EC8A6"></path></marker></defs>

<text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">On your devices</text>
<text x="400" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">On Render</text>
<text x="680" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">Behind the server</text>

<rect x="20" y="48" width="310" height="214" rx="16" fill="#1A2E26" stroke="#7EC8A6" stroke-width="1"></rect>
<g transform="translate(280 62) scale(3)" shape-rendering="crispEdges"><path fill="#7EC8A6" d="M1 0h1v1h-1z M8 0h1v1h-1z M1 1h1v1h-1z M2 1h1v1h-1z M7 1h1v1h-1z M8 1h1v1h-1z M1 2h1v1h-1z M2 2h1v1h-1z M3 2h1v1h-1z M6 2h1v1h-1z M7 2h1v1h-1z M8 2h1v1h-1z M0 3h1v1h-1z M1 3h1v1h-1z M2 3h1v1h-1z M3 3h1v1h-1z M4 3h1v1h-1z M5 3h1v1h-1z M6 3h1v1h-1z M7 3h1v1h-1z M8 3h1v1h-1z M9 3h1v1h-1z M0 4h1v1h-1z M1 4h1v1h-1z M2 4h1v1h-1z M3 4h1v1h-1z M4 4h1v1h-1z M5 4h1v1h-1z M6 4h1v1h-1z M7 4h1v1h-1z M8 4h1v1h-1z M9 4h1v1h-1z M0 5h1v1h-1z M1 5h1v1h-1z M3 5h1v1h-1z M4 5h1v1h-1z M5 5h1v1h-1z M6 5h1v1h-1z M8 5h1v1h-1z M9 5h1v1h-1z M0 6h1v1h-1z M1 6h1v1h-1z M2 6h1v1h-1z M4 6h1v1h-1z M5 6h1v1h-1z M7 6h1v1h-1z M8 6h1v1h-1z M9 6h1v1h-1z M0 7h1v1h-1z M1 7h1v1h-1z M2 7h1v1h-1z M3 7h1v1h-1z M4 7h1v1h-1z M5 7h1v1h-1z M6 7h1v1h-1z M7 7h1v1h-1z M8 7h1v1h-1z M9 7h1v1h-1z M1 8h1v1h-1z M2 8h1v1h-1z M3 8h1v1h-1z M4 8h1v1h-1z M5 8h1v1h-1z M6 8h1v1h-1z M7 8h1v1h-1z M8 8h1v1h-1z M3 9h1v1h-1z M4 9h1v1h-1z M5 9h1v1h-1z M6 9h1v1h-1z"></path></g>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Your iPhone</text>
<text x="40" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2F2F7">SQLite ledger, read and written by GRDB</text>
<text x="40" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">the source of truth: every screen observes it</text>
<text x="40" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2F2F7">Domain engine in Swift</text>
<text x="40" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">splits, netting, settlement, recurring, receipts</text>
<text x="40" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2F2F7">Sync outbox and pull cursor</text>
<text x="40" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">one envelope per change,</text>
<text x="40" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">drained in the background</text>

<rect x="20" y="300" width="310" height="112" rx="16" fill="#1C1C1E" stroke="#2C3A33" stroke-width="1"></rect>
<text x="40" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Your other iPhone, or a friend's</text>
<text x="40" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2F2F7">Pulls the same envelopes and replays</text>
<text x="40" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2F2F7">them into its own SQLite ledger.</text>
<text x="40" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">Shared ledgers are coming soon.</text>

<rect x="400" y="48" width="240" height="364" rx="16" fill="#1C1C1E" stroke="#2C3A33" stroke-width="1"></rect>
<text x="420" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Sync server</text>
<text x="420" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2F2F7">Go, one small binary on Render</text>
<text x="420" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2F2F7">Stores envelopes. Never reads</text>
<text x="420" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#F2F2F7">what is inside them.</text>
<path fill="none" stroke="#2C3A33" stroke-width="1" d="M420 334 H620"></path>
<text x="420" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">checks who may push to whom,</text>
<text x="420" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">answers pull pages by cursor,</text>
<text x="420" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">proxies receipt scans</text>

<rect x="680" y="48" width="250" height="84" rx="14" fill="#1C1C1E" stroke="#2C3A33" stroke-width="1"></rect>
<text x="698" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">PlanetScale Postgres</text>
<text x="698" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">the envelope log, accounts,</text>
<text x="698" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">links and shared groups</text>

<rect x="680" y="146" width="250" height="70" rx="14" fill="#1C1C1E" stroke="#2C3A33" stroke-width="1"></rect>
<text x="698" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Cloudflare R2</text>
<text x="698" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">receipt photos, private bucket</text>

<rect x="680" y="230" width="250" height="84" rx="14" fill="#1C1C1E" stroke="#2C3A33" stroke-width="1"></rect>
<text x="698" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Azure Document Intelligence</text>
<text x="698" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">reads a receipt's line items;</text>
<text x="698" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">the key stays on the server</text>

<rect x="680" y="328" width="250" height="84" rx="14" fill="#1C1C1E" stroke="#2C3A33" stroke-width="1"></rect>
<text x="698" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Backblaze B2</text>
<text x="698" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">nightly copies of the database</text>
<text x="698" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#A3A8A5">and the receipt photos</text>

